version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sentinelx-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=prod
      - SECRET_KEY=sentinelx-soc-production-secret-2026
      - JWT_SECRET_KEY=sentinelx-jwt-production-key-2026
      - DATABASE_URL=postgresql://sentinel_user:sentinel_pass@postgres:5432/sentinelx_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - postgres
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sentinelx-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

  postgres:
    image: postgres:16-alpine
    container_name: sentinelx-postgres
    restart: always
    environment:
      POSTGRES_USER: sentinel_user
      POSTGRES_PASSWORD: sentinel_pass
      POSTGRES_DB: sentinelx_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: sentinelx-redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  pgdata:
